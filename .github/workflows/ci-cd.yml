
name: Django CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 900360460976.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: djangov2

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test

  build:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: djangov2:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Trivy Vulnerability Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: djangov2:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy CRITICAL Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: djangov2:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Upload Trivy Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report-${{ github.sha }}
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900360460976:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag djangov2:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2 with Auto Rollback
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900360460976:role/GitHubActionsECRPushRole
          aws-region: ap-south-1

      - name: Deploy through SSM with health check and rollback
        env:
          NEW_SHA: ${{ github.sha }}
        run: |
          REMOTE_SCRIPT=$(cat <<'EOF'
          set -Eeuo pipefail

          APP_DIR=/opt/techcake-django-app-v2
          cd "$APP_DIR"

          git -c safe.directory="$APP_DIR" -C "$APP_DIR" fetch origin main
          git -c safe.directory="$APP_DIR" -C "$APP_DIR" reset --hard origin/main

          PREVIOUS_SHA=$(cat .last_working_sha 2>/dev/null || echo "v2")

          echo "Previous version: $PREVIOUS_SHA"
          echo "New version: $NEW_SHA"

          if ! aws ecr describe-images \
            --region ap-south-1 \
            --repository-name djangov2 \
            --image-ids imageTag="$PREVIOUS_SHA" >/dev/null 2>&1; then
            echo "ERROR: Rollback image $PREVIOUS_SHA is not available in ECR."
            exit 1
          fi

          aws ecr get-login-password --region ap-south-1 |
            docker login --username AWS --password-stdin 900360460976.dkr.ecr.ap-south-1.amazonaws.com

          rollback() {
            trap - ERR
            echo "DEPLOYMENT FAILED. Starting rollback to $PREVIOUS_SHA"

            export APP_VERSION="$PREVIOUS_SHA"

            if docker compose pull && docker compose up -d; then
              echo "ROLLBACK COMPLETED: $PREVIOUS_SHA"
              return 0
            else
              echo "CRITICAL: ROLLBACK FAILED"
              return 1
            fi
          }

          trap 'rollback' ERR

          export APP_VERSION="$NEW_SHA"

          docker compose pull
          docker compose up -d

          HEALTHY=false

          for i in $(seq 1 12); do
            if curl -fsS \
              https://djangov2.tc-2026-0055.nixlabs.in/health \
              -o /tmp/deploy-health.json &&
              NEW_SHA="$NEW_SHA" python3 -c '
          import json, os
          data = json.load(open("/tmp/deploy-health.json"))
          assert data.get("status") == "ok"
          assert data.get("sha") == os.environ["NEW_SHA"]
          '; then
              HEALTHY=true
              break
            fi

            echo "Health check attempt $i failed. Retrying..."
            sleep 10
          done

          if [ "$HEALTHY" = true ]; then
            printf '%s\n' "$NEW_SHA" > .last_working_sha.tmp
            mv .last_working_sha.tmp .last_working_sha

            trap - ERR
            echo "DEPLOYMENT SUCCESS: $NEW_SHA"
            exit 0
          fi

          echo "Health verification failed."
          rollback
          exit 1
          EOF
          )

          REMOTE_SCRIPT="export NEW_SHA=$NEW_SHA"$'\n'"$REMOTE_SCRIPT"

          ENCODED_SCRIPT=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)

          PARAMETERS=$(jq -n \
            --arg command "echo $ENCODED_SCRIPT | base64 -d | bash" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-032515684cf2635c7 \
            --document-name AWS-RunShellScript \
            --comment "Deploy Django commit $NEW_SHA with automatic rollback" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-032515684cf2635c7 \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          echo "SSM STATUS: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-032515684cf2635c7 \
            --query StandardOutputContent \
            --output text || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-032515684cf2635c7 \
            --query StandardErrorContent \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment or rollback failed."
            exit 1
          fi
