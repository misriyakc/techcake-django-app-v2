
name: Django CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 900360460976.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: djangov2
  S3_BUCKET: misriya-djangov2-s3-2026
  CODEDEPLOY_APP: techcake-django-app
  CODEDEPLOY_GROUP: techcake-django-bluegreen

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py test

  build:
    name: Build, Scan and Push to ECR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: djangov2:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Trivy Vulnerability Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: djangov2:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy CRITICAL Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: djangov2:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Upload Trivy Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report-${{ github.sha }}
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900360460976:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag djangov2:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy with CodeDeploy Blue/Green
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900360460976:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment bundle
        run: |
          mkdir -p deployment
          cp appspec.yml deployment/
          cp -r scripts deployment/
          echo "${{ github.sha }}" > deployment/APP_VERSION
          cd deployment
          zip -r ../deployment.zip .

      - name: Upload bundle to S3
        run: |
          aws s3 cp deployment.zip s3://${S3_BUCKET}/deployments/${GITHUB_SHA}.zip

      - name: Start CodeDeploy deployment
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --s3-location bucket="$S3_BUCKET",key="deployments/${GITHUB_SHA}.zip",bundleType=zip \
            --description "Deploy ${GITHUB_SHA}" \
            --query deploymentId \
            --output text)

          echo "Deployment ID: $DEPLOYMENT_ID"

          aws deploy wait deployment-successful \
            --deployment-id "$DEPLOYMENT_ID"

          echo "Blue/Green deployment succeeded: $DEPLOYMENT_ID"
