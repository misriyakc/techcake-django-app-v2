
name: Django CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 900360460976.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: djangov2

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Django tests
        run: |
          python manage.py test

  build:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: djangov2:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Trivy Vulnerability Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: djangov2:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy CRITICAL Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: djangov2:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Upload Trivy Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report-${{ github.sha }}
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Configure AWS credentials
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900360460976:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to ECR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag djangov2:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
