server {
    listen 80;
    server_name djangov2.tc-2026-0055.nixlabs.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name djangov2.tc-2026-0055.nixlabs.in;

    ssl_certificate /etc/letsencrypt/live/djangov2.tc-2026-0055.nixlabs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djangov2.tc-2026-0055.nixlabs.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    location / {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
