services:
  django:
    image: 900360460976.dkr.ecr.ap-south-1.amazonaws.com/djangov2:v2
    env_file:
      - .env
    expose:
      - "8000"
    command:
      - sh
      - -c
      - python manage.py collectstatic --noinput && exec gunicorn techcake_site.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -
    volumes:
      - staticfiles:/app/staticfiles
    networks:
      - djangov2-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /techcake/djangov2
        awslogs-stream: django
        awslogs-create-group: "true"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      django:
        condition: service_healthy
    networks:
      - djangov2-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /techcake/djangov2
        awslogs-stream: nginx
        awslogs-create-group: "true"

networks:
  djangov2-net:
    driver: bridge

volumes:
  staticfiles:
